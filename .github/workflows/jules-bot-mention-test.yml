name: Jules Bot Mention Test (throwaway)

on:
  push:
    branches:
      - investigation/28-jules-review-timeout

jobs:
  post-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post @jules mention via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 110 \
            --repo ${{ github.repository }} \
            --body "@jules review this pull request and list any blocking issues."
