name: Jules Code Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  jules-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Set jules/review status to success for draft PR
        if: github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state='success' \
            -f description='Skipped Jules Code Review for draft PR' \
            -f context='jules/review'

      - name: Checkout repository
        if: github.event.pull_request.draft == false
        uses: actions/checkout@v4

      - name: Run Jules PR Reviewer (attempt 1)
        id: jules_attempt_1
        if: github.event.pull_request.draft == false
        continue-on-error: true
        uses: ./.github/actions/jules-attempt
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Jules PR Reviewer (attempt 2)
        id: jules_attempt_2
        if: github.event.pull_request.draft == false && steps.jules_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/jules-attempt
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Jules PR Reviewer (attempt 3)
        id: jules_attempt_3
        if: github.event.pull_request.draft == false && steps.jules_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/jules-attempt
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set jules/review status to error after all attempts fail
        if: always() && github.event.pull_request.draft == false && steps.jules_attempt_1.outcome == 'failure' && steps.jules_attempt_2.outcome == 'failure' && steps.jules_attempt_3.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST /repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state='error' \
            -f description='Jules Code Review failed after 3 attempts (timeout or API error)' \
            -f context='jules/review'
          exit 1
