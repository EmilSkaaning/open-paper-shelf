name: Pyrefly Type Checking

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up uv
      uses: astral-sh/setup-uv@v2
      
    - name: Install dependencies
      run: uv sync --frozen
      
    - name: Run Pyrefly
      run: uv run pyrefly check
