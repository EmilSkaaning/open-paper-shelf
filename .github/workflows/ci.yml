name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v2

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run pre-commit
      env:
        SKIP: no-commit-to-branch
      run: uv run pre-commit run --all-files

    - name: Cache testmon data
      uses: actions/cache@v4
      with:
        path: .testmondata
        key: testmon-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          testmon-${{ runner.os }}-main

    - name: Run tests with coverage
      run: |
        uv run pytest --testmon --cov=backend --cov-report=term-missing --cov-fail-under=60 | tee -a $GITHUB_STEP_SUMMARY
