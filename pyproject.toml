[project]
name = "open-paper-shelf"
version = "0.1.0"
description = "A front-end for papers backed by Google Drive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pytest",
    "poethepoet",
    "fastapi[standard]",
    "uvicorn",
    "pip>=26.1.2",
    "httpx",
    "streamlit>=1.59.2",
    "google-api-python-client>=2.115.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "streamlit-keyup>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
test = "pytest"
fastapi = "fastapi dev open-paper-shelf/src/backend/main.py --port 8000"
streamlit = "streamlit run open-paper-shelf/src/frontend/app.py"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyrefly>=1.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
]
