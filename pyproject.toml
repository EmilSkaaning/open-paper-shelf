[project]
name = "open-paper-shelf"
version = "0.1.0"
description = "A front-end for papers backed by Google Drive"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pytest",
    "poethepoet",
    "fastapi[standard]",
    "uvicorn",
    "pip>=26.1.2",
    "httpx",
    "streamlit>=1.59.2",
    "google-api-python-client>=2.115.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "streamlit-keyup>=0.3.0",
    "huggingface_hub",
    "pypdf",
    "pip-system-certs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks]
test = "pytest"
test-backend = "pytest open-paper-shelf/src/tests/backend --testmon --cov=backend --cov-report=term-missing"
test-frontend = "pytest open-paper-shelf/src/tests/frontend --testmon --cov=frontend --cov-report=term-missing"
fastapi = "fastapi dev open-paper-shelf/src/backend/main.py --port 8000"
streamlit = "streamlit run open-paper-shelf/src/frontend/app.py"
ruff-format = "ruff format"
ruff-format-check = "ruff format --check ."
ruff-check = "ruff check ."
ruff-check-fix = "ruff check --fix"
pyrefly-check = "pyrefly check"
vulture-check = "vulture --min-confidence 70 --exclude .venv . vulture_whitelist.py"
skylos-check = { shell = "skylos . -a --confidence 80 || true" }
skylos-check-branch = { shell = "skylos . -a --confidence 80 --diff-base main || true" }
check = ["ruff-format-check", "ruff-check", "pyrefly-check", "vulture-check", "skylos-check"]

[tool.pytest.ini_options]
pythonpath = ["open-paper-shelf/src"]


[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyrefly>=1.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-testmon>=2.1.1",
    "ruff>=0.15.22",
    "skylos>=4.31.1",
    "vulture>=2.16",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "vulture_whitelist.py",
    "conftest.py",
    "__init__.py"
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search_path = ["open-paper-shelf/src"]
