repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run poe ruff-check-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run poe ruff-format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyrefly
        name: pyrefly check
        entry: uv run poe pyrefly-check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: vulture
        name: vulture dead code check
        entry: uv run poe vulture-check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: skylos
        name: skylos dead code / security check (branch diff)
        entry: uv run poe skylos-check-branch
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
      - id: trailing-whitespace
